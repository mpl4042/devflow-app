name: CI/CD Pipeline DevFlow Node.js

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependências
      run: npm install

    - name: Executar testes automatizados
      run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Fazer o Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}     # IP do servidor
        username: ${{ secrets.SERVER_USER }} # Usuário do servidor
        key: ${{ secrets.SSH_PRIVATE_KEY }}  # Chave SSH Privada
        script: |
          cd /caminho/da/sua/aplicacao/no/servidor
          git pull origin main
          npm install --production
